name: Deploy production

# Deploys on every push to main and on manual dispatch. It builds the ai image
# from main into prod's Artifact Registry and points prod's Cloud Run service
# at it. The steps live in build-deploy.yml, which deploy-dev.yml runs too.
#
# The `production` GitHub Environment supplies every name. Its deployment
# branch policy admits main only, so a dispatch from another branch fails.
# See deploy/README.md for the vars and secrets it needs.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production-ai
  cancel-in-progress: false

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-deploy.yml
    with:
      environment: production
    secrets: inherit
