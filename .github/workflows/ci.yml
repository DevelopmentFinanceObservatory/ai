name: CI

on:
  # One run on the merged tree after each merge into dev. main moves through a
  # pull request from dev whose own run tested the merge, so main has no push
  # trigger.
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main, "toolkit/**"]
    # `edited` catches a stacked PR's base retargeting, which emits only that
    # event. Without it, required checks would hang on "Expected".
    # `ready_for_review` starts the run when a draft is marked ready; the jobs
    # skip while the pull request is a draft.
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `just check` covers the lint and test jobs below, not docker -- keep the two
# in sync if either changes.
jobs:
  lint:
    # `edited` fires on closed PRs too; closed PRs need no checks.
    if: >-
      github.event.pull_request.draft != true &&
      (github.event_name != 'pull_request' || github.event.pull_request.state == 'open')
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install workspace
        run: uv sync --frozen --all-packages

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ty check -- common
        run: uv run ty check packages/common/src

      - name: ty check -- harness
        run: uv run ty check services/harness/src

      - name: ty check -- data-mcp
        run: uv run ty check services/data-mcp/src

      - name: ty check -- analysis-mcp
        run: uv run ty check services/analysis-mcp/src

      - name: ty check -- presentation-mcp
        run: uv run ty check services/presentation-mcp/src

  test:
    if: >-
      github.event.pull_request.draft != true &&
      (github.event_name != 'pull_request' || github.event.pull_request.state == 'open')
    runs-on: ubuntu-latest
    # The suite takes about 12 minutes here in one process; four xdist
    # workers run it 4.5 times faster on a laptop. faulthandler_timeout in
    # pyproject.toml ends a run whose test hangs before failing; this cap
    # ends every other hang.
    timeout-minutes: 20
    env:
      UV_FROZEN: "1"
      # The Postgres-backed fixtures in services/harness/tests/conftest.py.
      HARNESS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install workspace
        run: uv sync --frozen --all-packages

      # presentation-mcp's browser tests (`-m browser`) drive the view page in
      # headless Chromium, and fail without it.
      - name: Install Chromium
        run: uv run playwright install --with-deps --only-shell chromium

      # The test database is thrown away with the runner, so durability buys
      # nothing; these cut the time of every CREATE DATABASE and commit.
      - name: Turn off Postgres durability
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U postgres
          -c "ALTER SYSTEM SET fsync = off"
          -c "ALTER SYSTEM SET synchronous_commit = off"
          -c "ALTER SYSTEM SET full_page_writes = off"
          -c "SELECT pg_reload_conf()"

      # `ubuntu-latest` in a public repository is a 4 vCPU runner, so `-n auto`
      # starts four workers. It lives here rather than in addopts so a targeted
      # local run stays in one process, where output reads in order and pdb
      # works. `--durations` lists the slowest tests, the ones to look at when
      # the job grows.
      - name: Test -- all packages
        run: uv run pytest -n auto --durations=25 --durations-min=1.0

  docker:
    # Catches a broken Dockerfile.ai before merge.
    if: >-
      github.event.pull_request.draft != true &&
      (github.event_name != 'pull_request' || github.event.pull_request.state == 'open')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.ai
          push: false
          cache-from: type=gha
          # The cache is an optimization; export failures should warn, not fail the build.
          cache-to: type=gha,mode=max,ignore-error=true
