name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main, "toolkit/**"]
    # `edited` catches a stacked PR's base retargeting, which emits only that
    # event. Without it, required checks would hang on "Expected".
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `just check` covers the lint and test jobs below, not docker -- keep the two
# in sync if either changes.
jobs:
  lint:
    # `edited` fires on closed PRs too; closed PRs need no checks.
    # Mints a dfo-reader token, which prod keeps only in main-limited
    # environments, so this runs in ONEcampaign only. The identical tree
    # ran it here before it was synced.
    if: >-
      github.repository_owner == 'ONEcampaign' &&
      (github.event_name != 'pull_request' || github.event.pull_request.state == 'open')
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      # ONEcampaign/dfo-spec-kit is a private repo the default GITHUB_TOKEN
      # cannot read; the services pull its packages as git dependencies, so
      # `uv sync` needs a read token on it. The rewrite covers ONEcampaign
      # URLs only, so the token travels with no other fetch.
      - id: spec-kit-token
        name: Mint a read token for dfo-spec-kit
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.READER_APP_PRIVATE_KEY }}
          owner: ONEcampaign
          repositories: dfo-spec-kit
          permission-contents: read

      - name: Authenticate git for the dfo-spec-kit dependencies
        run: git config --global url."https://x-access-token:${READER_TOKEN}@github.com/ONEcampaign/".insteadOf "https://github.com/ONEcampaign/"
        env:
          READER_TOKEN: ${{ steps.spec-kit-token.outputs.token }}

      - name: Install workspace
        run: uv sync --frozen --all-packages

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ty check -- common
        run: uv run ty check packages/common/src

      - name: ty check -- harness
        run: uv run ty check services/harness/src

      - name: ty check -- data-mcp
        run: uv run ty check services/data-mcp/src

      - name: ty check -- analysis-mcp
        run: uv run ty check services/analysis-mcp/src

      - name: ty check -- presentation-mcp
        run: uv run ty check services/presentation-mcp/src

  test:
    # Mints a dfo-reader token, which prod keeps only in main-limited
    # environments, so this runs in ONEcampaign only. The identical tree
    # ran it here before it was synced.
    if: >-
      github.repository_owner == 'ONEcampaign' &&
      (github.event_name != 'pull_request' || github.event.pull_request.state == 'open')
    runs-on: ubuntu-latest
    # The suite takes about three minutes. faulthandler_timeout in
    # pyproject.toml ends a run whose test hangs before failing; this cap
    # ends every other hang.
    timeout-minutes: 20
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      # ONEcampaign/dfo-spec-kit is a private repo the default GITHUB_TOKEN
      # cannot read; the services pull its packages as git dependencies, so
      # `uv sync` needs a read token on it. The rewrite covers ONEcampaign
      # URLs only, so the token travels with no other fetch.
      - id: spec-kit-token
        name: Mint a read token for dfo-spec-kit
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.READER_APP_PRIVATE_KEY }}
          owner: ONEcampaign
          repositories: dfo-spec-kit
          permission-contents: read

      - name: Authenticate git for the dfo-spec-kit dependencies
        run: git config --global url."https://x-access-token:${READER_TOKEN}@github.com/ONEcampaign/".insteadOf "https://github.com/ONEcampaign/"
        env:
          READER_TOKEN: ${{ steps.spec-kit-token.outputs.token }}

      - name: Install workspace
        run: uv sync --frozen --all-packages

      - name: Test -- all packages
        run: uv run pytest

  docker:
    # Catches a broken Dockerfile.ai before merge. uv.lock has git+ deps on
    # ONEcampaign/dfo-spec-kit, so the build needs spec_kit_token --
    # Dockerfile.ai mounts it as a BuildKit secret around the uv sync layers.
    # Mints a dfo-reader token, which prod keeps only in main-limited
    # environments, so this runs in ONEcampaign only. The identical tree
    # ran it here before it was synced.
    if: >-
      github.repository_owner == 'ONEcampaign' &&
      (github.event_name != 'pull_request' || github.event.pull_request.state == 'open')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - id: spec-kit-token
        name: Mint a read token for dfo-spec-kit
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.READER_APP_CLIENT_ID }}
          private-key: ${{ secrets.READER_APP_PRIVATE_KEY }}
          owner: ONEcampaign
          repositories: dfo-spec-kit
          permission-contents: read

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.ai
          push: false
          cache-from: type=gha
          # The cache is an optimization; export failures should warn, not fail the build.
          cache-to: type=gha,mode=max,ignore-error=true
          secrets: |
            spec_kit_token=${{ steps.spec-kit-token.outputs.token }}
