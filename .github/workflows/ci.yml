name: CI

on:
  # One run on the merged tree after each merge into dev. main moves through a
  # pull request from dev whose own run tested the merge, so main has no push
  # trigger.
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main, "toolkit/**"]
    # `edited` catches a stacked PR's base retargeting, which emits only that
    # event. Without it, required checks would hang on "Expected".
    # `ready_for_review` starts the run when a draft is marked ready; the jobs
    # skip while the pull request is a draft.
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `just check` covers the lint and test jobs below, not docker -- keep the two
# in sync if either changes.
jobs:
  lint:
    # `edited` fires on closed PRs too; closed PRs need no checks.
    if: >-
      github.event.pull_request.draft != true &&
      (github.event_name != 'pull_request' || github.event.pull_request.state == 'open')
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install workspace
        run: uv sync --frozen --all-packages

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      - name: ty check -- common
        run: uv run ty check packages/common/src

      - name: ty check -- harness
        run: uv run ty check services/harness/src

      - name: ty check -- data-mcp
        run: uv run ty check services/data-mcp/src

      - name: ty check -- analysis-mcp
        run: uv run ty check services/analysis-mcp/src

      - name: ty check -- presentation-mcp
        run: uv run ty check services/presentation-mcp/src

  test:
    if: >-
      github.event.pull_request.draft != true &&
      (github.event_name != 'pull_request' || github.event.pull_request.state == 'open')
    runs-on: ubuntu-latest
    # The suite takes about three minutes. faulthandler_timeout in
    # pyproject.toml ends a run whose test hangs before failing; this cap
    # ends every other hang.
    timeout-minutes: 20
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install workspace
        run: uv sync --frozen --all-packages

      - name: Test -- all packages
        run: uv run pytest

  docker:
    # Catches a broken Dockerfile.ai before merge.
    if: >-
      github.event.pull_request.draft != true &&
      (github.event_name != 'pull_request' || github.event.pull_request.state == 'open')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.ai
          push: false
          cache-from: type=gha
          # The cache is an optimization; export failures should warn, not fail the build.
          cache-to: type=gha,mode=max,ignore-error=true
