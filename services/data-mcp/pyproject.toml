[project]
name = "data_mcp"
version = "0.1.0"
description = "Thin FastMCP wrapper over the dfo-apis Data seam: the Search API today, the Datasets API next."
requires-python = ">=3.13"
dependencies = [
    "common",
    "dfo-spec-kit",
    "dfo-spec-kit-frame-grammar",
    "fastmcp>=4.0.10,<5",
    "google-cloud-storage>=2.18",
    "httpx2>=2.13.0",
    "opentelemetry-api>=1.42",
    "pyarrow>=18.0",
    "pydantic-settings>=2.14.2",
    "rfc8785>=0.1.4",
]

[project.scripts]
data-mcp = "data_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
precision = 2

[tool.uv.sources]
common = { workspace = true }
dfo-spec-kit = { git = "https://github.com/ONEcampaign/dfo-spec-kit.git", rev = "959f8bc9876ae60d000c405c66b62ea588759f19", subdirectory = "python/spec-kit" }
dfo-spec-kit-frame-grammar = { git = "https://github.com/ONEcampaign/dfo-spec-kit.git", rev = "959f8bc9876ae60d000c405c66b62ea588759f19", subdirectory = "python/frame-grammar" }
